
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Kelas - SkillShare Campus</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar">
        <h2>SkillShare Campus</h2>
        <div class="nav-menu">
            <a href="beranda.html">Beranda</a>
            <a href="kelas.html">Kelas</a>
            <a href="tambah.html">Buat Kelas</a>
            <a href="login.html">Login</a>
        </div>
    </nav>

    <section class="container">
        <h2>Jelajahi Kelas</h2>
        <p>Temukan kelas yang sesuai dengan minat dan kemampuanmu.</p>

        <br>

        <input
            type="text"
            id="cariKelas"
            placeholder="Cari nama kelas..."
        >

        <select id="filterKategori">
            <option value="">Semua Kategori</option>
            <option value="Teknologi">Teknologi</option>
            <option value="Desain">Desain</option>
            <option value="Public Speaking">Public Speaking</option>
            <option value="Musik">Musik</option>
        </select>

        <br><br>

        <div id="daftarSemuaKelas" class="class-list"></div>
    </section>

    <footer>
        <p>© 2026 SkillShare Campus</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
