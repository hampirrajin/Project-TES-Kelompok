  <!-- Tailwind CSS (lewat CDN, tidak perlu instalasi) -->

  <!-- Warna, font, dan komponen yang dipakai semua halaman.
       BAGIAN INI SAMA DI SEMUA FILE HTML. Jangan diubah sendiri, tanya Anggota 1. -->
  <style type="text/tailwindcss">
    @theme {
      --color-navy: #0B1B4D;
      --color-biru: #2563EB;
      --color-biru-tua: #1E3A8A;
      --color-biru-muda: #DBEAFE;
      --color-biru-tipis: #BFDBFE;
      --color-langit: #EFF6FF;
      --color-awan: #F4F8FF;
      --color-garis: #C7D7F5;
      --color-redup: #475A85;
      --font-judul: "Playfair Display", serif;
      --font-sans: "Poppins", system-ui, sans-serif;
    }

    @layer components {
      .tombol-utama   { @apply inline-flex items-center justify-center min-h-12 px-7 rounded-full bg-biru text-white font-semibold cursor-pointer transition-colors hover:bg-biru-tua disabled:bg-biru-tipis disabled:text-biru-tua disabled:cursor-not-allowed; }
      .tombol-tua     { @apply inline-flex items-center justify-center min-h-12 px-7 rounded-full bg-biru-tua text-white font-semibold cursor-pointer transition-colors hover:bg-navy; }
      .tombol-putih   { @apply inline-flex items-center justify-center min-h-12 px-8 rounded-full bg-white text-navy font-semibold cursor-pointer transition-colors hover:bg-langit; }
      .tombol-garis   { @apply inline-flex items-center justify-center min-h-12 px-7 rounded-full border-2 border-biru text-biru font-semibold cursor-pointer transition-colors hover:bg-langit; }
      .tombol-garis-putih { @apply inline-flex items-center justify-center min-h-12 px-8 rounded-full border-2 border-white text-white font-semibold cursor-pointer transition-colors hover:bg-white/10; }
      .kolom          { @apply w-full h-13 px-4 rounded-xl border-2 border-biru-tipis bg-white text-navy placeholder:text-slate-400 focus:outline-3 focus:outline-biru-tipis focus:border-biru; }
      .kolom-pil      { @apply flex items-center gap-3 h-14 px-5 rounded-full border-2 border-biru-tipis bg-white text-biru-tua focus-within:border-biru focus-within:outline-3 focus-within:outline-biru-tipis; }
      .kolom-pil input { @apply flex-1 min-w-0 bg-transparent text-navy outline-none placeholder:text-slate-400; }
      .label-form     { @apply block mb-2 text-sm font-semibold text-navy; }
      .error          { @apply mt-1.5 pl-1 text-sm font-medium text-red-700 empty:hidden; }
      .kartu          { @apply bg-white border border-garis rounded-3xl; }
      .chip           { @apply inline-flex items-center justify-center px-4 py-1.5 rounded-full bg-biru-muda text-navy text-sm font-semibold; }
      .nav-link       { @apply py-2 text-sm font-semibold text-navy border-b-4 border-transparent hover:text-biru; }
      .nav-link.aktif { @apply text-biru border-biru; }
    }
  </style>

  <!-- JavaScript bersama (data, login, fungsi bantu) -->
  <script src="js/data.js"></script>
  <!-- Kalau belum login, otomatis dikirim ke halaman Login -->
  <script>wajibLogin();</script>
</head>

<body class="bg-white font-sans text-navy antialiased">

  <!-- ===== NAVBAR (sama di semua halaman setelah login) ===== -->
  <header class="sticky top-0 z-40 bg-white border-b border-garis">
    <div class="max-w-7xl mx-auto px-6 py-3 flex flex-wrap items-center justify-between gap-x-8 gap-y-2">
      <div class="flex items-center gap-3">
        <button id="btn-menu" type="button" aria-label="Buka menu" aria-expanded="false" aria-controls="menu-utama"
                class="xl:hidden size-11 rounded-xl bg-langit text-biru-tua flex items-center justify-center cursor-pointer">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <a href="beranda.html" class="font-judul font-bold text-xl sm:text-2xl tracking-wider text-navy">SKILLSHARE CAMPUS</a>
      </div>
      <nav id="menu-utama" aria-label="Menu utama" class="hidden xl:flex basis-full xl:basis-auto flex-col xl:flex-row xl:items-center gap-x-7 gap-y-1">
        <a class="nav-link" href="beranda.html">Beranda</a>
        <a class="nav-link" href="kelas.html">Daftar Kelas</a>
        <a class="nav-link" href="tambah.html">Tambah Kelas</a>
        <a class="nav-link" href="tabel.html">Data Pendaftaran</a>
        <a class="nav-link aktif" aria-current="page" href="statistik.html">Statistik</a>
        <a class="nav-link" href="peta.html">Peta</a>
        <span class="flex items-center gap-3 xl:ml-2 py-2 xl:py-0">
          <span class="text-sm text-redup">Halo, <strong id="nama-user" class="text-navy"></strong></span>
          <button id="btn-logout" type="button" class="tombol-garis min-h-10 px-5 text-sm">Keluar</button>
        </span>
      </nav>
    </div>
  </header>

  <main>
    <!-- ===== HALAMAN STATISTIK (Anggota 6) ===== -->
    <section aria-labelledby="judul-statistik">
      <div class="max-w-7xl mx-auto px-6 py-10 sm:py-14">
        <h1 id="judul-statistik" class="text-center font-judul font-semibold text-3xl sm:text-4xl tracking-widest text-navy">STATISTIK</h1>
        <p class="mt-3 text-center text-redup">Ringkasan kelas dan kuota yang dihitung langsung dari data.</p>

        <dl class="mt-8 grid grid-cols-1 gap-4 sm:grid-cols-3">
          <div class="kartu bg-langit p-6 text-center flex flex-col-reverse"><dt class="mt-1 text-sm text-redup">Total kelas</dt><dd id="stat-total-kelas" class="font-judul font-bold text-4xl text-biru-tua">0</dd></div>
          <div class="kartu bg-langit p-6 text-center flex flex-col-reverse"><dt class="mt-1 text-sm text-redup">Total pendaftaran</dt><dd id="stat-total-daftar" class="font-judul font-bold text-4xl text-biru-tua">0</dd></div>
          <div class="kartu bg-langit p-6 text-center flex flex-col-reverse"><dt class="mt-1 text-sm text-redup">Total kursi tersisa</dt><dd id="stat-total-sisa" class="font-judul font-bold text-4xl text-biru-tua">0</dd></div>
        </dl>

        <p id="statistik-pesan" class="hidden mt-6 rounded-2xl bg-langit border border-garis p-6 text-center text-redup"></p>

        <div class="mt-8 grid grid-cols-1 gap-6 lg:grid-cols-[minmax(0,3fr)_minmax(0,2fr)]">
          <figure class="kartu p-4 sm:p-6"><div id="chart-kuota" class="h-[460px]"></div></figure>
          <figure class="kartu p-4 sm:p-6"><div id="chart-kategori" class="h-[460px]"></div></figure>
        </div>
      </div>
    </section>
  </main>

  <footer class="border-t border-garis bg-langit">
    <div class="max-w-7xl mx-auto px-6 py-6 text-center text-sm text-redup">
      &copy; 2026 SkillShare Campus &middot; Proyek UTS Pemrograman Web
    </div>
  </footer>

  <!-- Pesan kecil (toast) -->
  <div id="toast" role="status" aria-live="polite"
       class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 max-w-[90vw] rounded-full bg-navy px-6 py-3 text-sm font-medium text-white shadow-lg opacity-0 pointer-events-none transition-opacity duration-300"></div>

  <script src="https://cdn.jsdelivr.net/npm/highcharts@13.1.1/highcharts.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highcharts@13.1.1/modules/accessibility.js"></script>

  <!-- ===== JavaScript khusus halaman ini ===== -->
  <script>
    // 1) Hitung angka dari data
    const kelas = ambilSemuaKelas();
    const namaKelas = [];
    const terisi = [];
    const sisa = [];
    let totalDaftar = 0;
    let totalSisa = 0;

    for (let i = 0; i < kelas.length; i++) {
      const jumlahTerisi = hitungPendaftar(kelas[i].id);
      const jumlahSisa = sisaKuota(kelas[i]);
      namaKelas.push(kelas[i].nama);
      terisi.push(jumlahTerisi);
      sisa.push(jumlahSisa);
      totalDaftar += jumlahTerisi;
      totalSisa += jumlahSisa;
    }

    el('stat-total-kelas').textContent = kelas.length;
    el('stat-total-daftar').textContent = totalDaftar;
    el('stat-total-sisa').textContent = totalSisa;

    // Data pie: jumlah pendaftar tiap kategori (kategori tanpa pendaftar dilewati)
    const dataPie = [];
    for (let i = 0; i < KATEGORI.length; i++) {
      let jumlah = 0;
      for (let j = 0; j < kelas.length; j++) {
        if (kelas[j].kategori === KATEGORI[i].nama) jumlah += terisi[j];
      }
      if (jumlah > 0) dataPie.push({ name: KATEGORI[i].nama, y: jumlah });
    }

    // 2) Gambar grafik dengan Highcharts
    if (typeof Highcharts === 'undefined') {
      el('statistik-pesan').textContent = 'Grafik belum bisa dimuat. Cek koneksi internet, lalu muat ulang halaman.';
      el('statistik-pesan').classList.remove('hidden');
    } else {
      // Grafik 1: bar bertumpuk, kursi terisi dan sisa per kelas
      Highcharts.chart('chart-kuota', {
        chart: { type: 'bar', backgroundColor: 'transparent', style: { fontFamily: 'Poppins, sans-serif' } },
        title: { text: 'Kursi Terisi dan Sisa per Kelas', style: { color: '#0B1B4D', fontWeight: '600' } },
        xAxis: { categories: namaKelas },
        yAxis: { min: 0, allowDecimals: false, reversedStacks: false, title: { text: 'Jumlah kursi' } },
        plotOptions: { series: { stacking: 'normal', borderWidth: 0 } },
        colors: ['#1E3A8A', '#93C5FD'],
        series: [
          { name: 'Terisi', data: terisi },
          { name: 'Sisa kuota', data: sisa }
        ],
        credits: { enabled: false }
      });

      // Grafik 2: pie, pendaftar per kategori
      Highcharts.chart('chart-kategori', {
        chart: { type: 'pie', backgroundColor: 'transparent', style: { fontFamily: 'Poppins, sans-serif' } },
        title: { text: 'Pendaftar per Kategori', style: { color: '#0B1B4D', fontWeight: '600' } },
        tooltip: { pointFormat: '<b>{point.y}</b> pendaftar ({point.percentage:.0f}%)' },
        plotOptions: {
          pie: {
            colors: ['#0B1B4D', '#2563EB', '#93C5FD'],
            showInLegend: true,
            dataLabels: { enabled: true, format: '{point.y}' }
          }
        },
        series: [{ name: 'Jumlah pendaftar', data: dataPie }],
        credits: { enabled: false }
      });
    }
  </script>
</body>
</html>
