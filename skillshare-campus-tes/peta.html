      .tombol-garis   { @apply inline-flex items-center justify-center min-h-12 px-7 rounded-full border-2 border-biru text-biru font-semibold cursor-pointer transition-colors hover:bg-langit; }

      .chip           { @apply inline-flex items-center justify-center px-4 py-1.5 rounded-full bg-biru-muda text-navy text-sm font-semibold; }
      .nav-link       { @apply py-2 text-sm font-semibold text-navy border-b-4 border-transparent hover:text-biru; }

  <main>
    <!-- ===== HALAMAN PETA (Anggota 6) ===== -->
    <section aria-labelledby="judul-peta">
      <div class="max-w-7xl mx-auto px-6 py-10 sm:py-14">
        <h1 id="judul-peta" class="text-center font-judul font-semibold text-3xl sm:text-4xl tracking-widest text-navy">PETA LOKASI KELAS</h1>
        <p class="mt-3 text-center text-redup">Klik penanda untuk melihat kelas yang berlangsung di lokasi itu.</p>
        <p id="peta-pesan" class="hidden mt-6 rounded-2xl bg-langit border border-garis p-6 text-center text-redup"></p>
        <div id="peta" class="isolate mt-8 h-[65vh] min-h-96 rounded-3xl border border-garis overflow-hidden"></div>
      </div>
    </section>
  </main>

  <footer class="border-t border-garis bg-langit">
    <div class="max-w-7xl mx-auto px-6 py-6 text-center text-sm text-redup">
      &copy; 2026 SkillShare Campus &middot; Proyek UTS Pemrograman Web
    </div>
  </footer>

  <!-- Pesan kecil (toast) -->
  <div id="toast" role="status" aria-live="polite"
       class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 max-w-[90vw] rounded-full bg-navy px-6 py-3 text-sm font-medium text-white shadow-lg opacity-0 pointer-events-none transition-opacity duration-300"></div>

  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- ===== JavaScript khusus halaman ini ===== -->
  <script>
    if (typeof L === 'undefined') {
      // Leaflet gagal dimuat (biasanya karena internet mati)
      el('peta-pesan').textContent = 'Peta belum bisa dimuat. Cek koneksi internet, lalu muat ulang halaman.';
      el('peta-pesan').classList.remove('hidden');
    } else {
      // 1) Buat peta dan pasang gambar petanya (OpenStreetMap)
      const peta = L.map('peta').setView(PUSAT_KAMPUS, 17);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(peta);

      // 2) Kelompokkan kelas berdasarkan lokasi, contoh: { 'Aula': [kelas, kelas] }
      const perLokasi = {};
      const semua = ambilSemuaKelas();
      for (let i = 0; i < semua.length; i++) {
        const k = semua[i];
        if (!perLokasi[k.lokasi]) perLokasi[k.lokasi] = [];
        perLokasi[k.lokasi].push(k);
      }

      // 3) Satu penanda untuk tiap lokasi. Klik penanda -> popup daftar kelas
      const namaLokasiDipakai = Object.keys(perLokasi);
      for (let i = 0; i < namaLokasiDipakai.length; i++) {
        const namaLokasi = namaLokasiDipakai[i];
        const koordinat = LOKASI_KAMPUS[namaLokasi];
        if (!koordinat) continue;   // lokasi tidak dikenal, lewati

        let daftar = '';
        for (let j = 0; j < perLokasi[namaLokasi].length; j++) {
          const k = perLokasi[namaLokasi][j];
          daftar += '<li><a href="detail.html?id=' + k.id + '">' + esc(k.nama) + '</a><br>' +
                    '<span style="font-size:12px;color:#475A85">' + esc(k.jadwal) + ' &middot; sisa ' + sisaKuota(k) + ' kursi</span></li>';
        }

        L.marker(koordinat)
          .addTo(peta)
          .bindPopup('<strong>' + esc(namaLokasi) + '</strong><ul style="margin:6px 0 0 16px;padding:0;list-style:disc">' + daftar + '</ul>');
      }
    }
  </script>
</body>
